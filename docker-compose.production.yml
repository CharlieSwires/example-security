services:
  backend:
    image: example-security-backend:krystal
    restart: unless-stopped

    env_file:
      - /etc/example-security/backend.env

    environment:
      TZ: Etc/UTC
      SSL_ENABLED: "false"
      REQUIRE_EXTERNAL_SERVICES: "true"

    expose:
      - "8080"

    networks:
      - app

    healthcheck:
      test:
        - CMD-SHELL
        - >
          curl -fsS
          http://localhost:8080/ExampleSecurity/actuator/health/readiness
          | grep -q '"status":"UP"'
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 45s

  frontend:
    image: example-security-frontend:krystal
    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "5173:80"

    networks:
      - app

    healthcheck:
      test:
        - CMD-SHELL
        - >
          wget -qO- http://localhost/health
          | grep -q '"status":"UP"'
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 10s

networks:
  app:
    driver: bridge