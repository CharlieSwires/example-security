server:
  port: 8080
  # Tomcat only honours forwarding headers received from an internal/trusted proxy.
  # Direct clients cannot spoof the address used by auditing and login throttling.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto
      internal-proxies: ${TRUSTED_PROXY_REGEX:10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|169\.254\.\d{1,3}\.\d{1,3}|127\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[0-1])\.\d{1,3}\.\d{1,3}|0:0:0:0:0:0:0:1|::1}
  servlet:
    context-path: /ExampleSecurity
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
  ssl:
    enabled: ${SSL_ENABLED:false}
    key-store: ${SSL_KEYSTORE:classpath:keystore.p12}
    key-store-password: ${SSL_KEYSTORE_PASSWORD:changeit}
    key-store-type: PKCS12
    key-alias: ${SSL_KEY_ALIAS:examplesecurity}

spring:
  data:
    mongodb:
      # Intentionally no unauthenticated fallback: every environment must
      # provide an authenticated MongoDB connection string.
      uri: ${MONGODB_URI}
      auto-index-creation: true
  session:
    store-type: mongodb
    timeout: ${SESSION_TIMEOUT:30m}
    mongodb:
      collection-name: ${SESSION_COLLECTION_NAME:spring_sessions}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        debug: ${MAIL_DEBUG:false}
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://localhost:5173}
  frontend-base-url: ${FRONTEND_BASE_URL:https://localhost:5173}
  backend-base-url: ${BACKEND_BASE_URL:https://localhost:8080/ExampleSecurity}
  mail:
    from: ${MAIL_FROM:no-reply@example-security.local}
  initial-super:
    username: ${INITIAL_SUPER_USERNAME:super}
    password: ${INITIAL_SUPER_PASSWORD:ChangeThisPassword123!}

  crypto:
    enabled: ${FIELD_CRYPTO_ENABLED:true}
    passphrase: ${FIELD_CRYPTO_PASSPHRASE:}
    master-salt: ${FIELD_CRYPTO_MASTER_SALT_B64:}
  security:
    max-request-bytes: ${MAX_REQUEST_BYTES:262144}
    debug-request-logging: ${SECURITY_DEBUG_REQUEST_LOGGING:false}
    audit:
      persist: ${SECURITY_AUDIT_PERSIST:true}
    login:
      max-user-ip-failures: ${LOGIN_MAX_USER_IP_FAILURES:5}
      max-ip-failures: ${LOGIN_MAX_IP_FAILURES:25}
      failure-window-minutes: ${LOGIN_FAILURE_WINDOW_MINUTES:15}
      lockout-minutes: ${LOGIN_LOCKOUT_MINUTES:15}
    password-reset:
      max-account-requests: ${PASSWORD_RESET_MAX_ACCOUNT_REQUESTS:3}
      max-ip-requests: ${PASSWORD_RESET_MAX_IP_REQUESTS:20}
      window-minutes: ${PASSWORD_RESET_WINDOW_MINUTES:60}
      lockout-minutes: ${PASSWORD_RESET_LOCKOUT_MINUTES:60}
logging:
  level:
    org.springframework.mail: DEBUG
    jakarta.mail: DEBUG
