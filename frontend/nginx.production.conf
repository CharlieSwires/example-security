server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Krystal LB health check. This reaches Spring Boot readiness through the
    # private Docker network and therefore checks the application and MongoDB.
    location = /health {
        proxy_pass http://backend:8080/ExampleSecurity/actuator/health/readiness;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    location /ExampleSecurity/ {
        proxy_pass http://backend:8080/ExampleSecurity/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
    }

    location / {
        try_files $uri /index.html;
    }
}
